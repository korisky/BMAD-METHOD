# Beads Integration Injections
# These get injected into BMAD agent files during installation

injections:
  # Inject Beads status into [WS] workflow
  - file: "_bmad/bmm/workflows/workflow-status/instructions.md"
    point: "workflow-status-beads"
    requires: "beads-enabled"
    content: |
      <action>If Beads enabled, show runtime status after BMAD status:</action>
      <output>
      **Beads Runtime:** `bd_halts` | `bd ready --limit 3` | `bd_who`
      </output>

  # Inject into ALL agents (bmad-master, pm, architect, sm, dev)
  - file: "_bmad/bmm/agents/dev.md"
    point: "beads-critical-actions"
    requires: "beads-enabled"
    content: |
      <!-- BEADS INTEGRATION -->
      ## Before Starting Work
      1. `bd_session_start` → Check HALTs, ready work, branch sync
      2. `bd_claim "{story-key}"` → Claim before coding
      3. If HALTs exist → resolve or escalate first

      ## During Work
      - Commit normally (hooks auto-sync)
      - `bd_halt "{reason}"` → critical blocker (stops work)
      - `bd_decision "{title}"` → runtime decision
      - `bd_sync_story {file}` → after adding AI-Review items

      ## Session End
      1. `bd_release {id}` → release claims (if any)
      2. Check workflow mode:
         - Agent mode: `bd_land` (sync branches) → `bd_preflight` → `git push`
         - Mixed/Human mode: `bd_preflight` → `git push` (hooks handle sync)

      **Note**: In mixed/human workflows, pre-push hook syncs only if needed.
      **For strict sync**: Use `bd_land` manually or set `bd_config_workflow agent`
      **Something broke?** `bd_fix`
      <!-- END BEADS INTEGRATION -->

  - file: "_bmad/bmm/agents/sm.md"
    point: "beads-critical-actions"
    requires: "beads-enabled"
    content: |
      <!-- BEADS INTEGRATION -->
      ## Before Starting Work
      1. `bd_session_start` → Check HALTs, ready work, branch sync
      2. If HALTs exist → resolve or escalate first

      ## Sprint Management
      - `bd_blocker "Dep: Story {B} needs {A}"` → cross-story deps
      - `bd_decision "Defer: {story} to next sprint"` → deferrals
      - `bd_action "Action: {item}"` → retrospective items

      ## Session End
      1. Check workflow mode:
         - Agent mode: `bd_land` (sync branches) → `bd_preflight` → `git push`
         - Mixed/Human mode: `bd_preflight` → `git push` (hooks handle sync)

      **Note**: In mixed/human workflows, pre-push hook syncs only if needed.
      **For strict sync**: Use `bd_land` manually or set `bd_config_workflow agent`
      **Something broke?** `bd_fix`
      <!-- END BEADS INTEGRATION -->

  - file: "_bmad/bmm/agents/pm.md"
    point: "beads-critical-actions"
    requires: "beads-enabled"
    content: |
      <!-- BEADS INTEGRATION -->
      ## Before Starting Work
      1. `bd_session_start` → Check HALTs, blockers, scope state
      2. If HALTs exist → resolve or escalate first

      ## Runtime Decisions (Beads vs BMAD)
      - BMAD: ADRs (architecture.md), phase progress (workflow-status.yaml)
      - Beads: Runtime scope/priority changes AFTER formal workflows
      - `bd_decision "Scope: {change}"` → scope changes
      - `bd_decision "Priority: {change}"` → priority changes

      ## Session End
      1. Check workflow mode:
         - Agent mode: `bd_land` (sync branches) → `bd_preflight` → `git push`
         - Mixed/Human mode: `bd_preflight` → `git push` (hooks handle sync)

      **Note**: In mixed/human workflows, pre-push hook syncs only if needed.
      **For strict sync**: Use `bd_land` manually or set `bd_config_workflow agent`
      **Something broke?** `bd_fix`
      <!-- END BEADS INTEGRATION -->

  - file: "_bmad/bmm/agents/architect.md"
    point: "beads-critical-actions"
    requires: "beads-enabled"
    content: |
      <!-- BEADS INTEGRATION -->
      ## Before Starting Work
      1. `bd_session_start` → Check HALTs, technical blockers
      2. If HALTs exist → resolve or escalate first

      ## Post-Architecture Changes (Beads vs BMAD)
      - BMAD: ADRs captured in architecture.md during workflow
      - Beads: Post-workflow tech/pattern changes only
      - `bd_decision "Tech: {change}"` → technology pivots
      - `bd_decision "Pattern: {change}"` → pattern changes

      ## Session End
      1. Check workflow mode:
         - Agent mode: `bd_land` (sync branches) → `bd_preflight` → `git push`
         - Mixed/Human mode: `bd_preflight` → `git push` (hooks handle sync)

      **Note**: In mixed/human workflows, pre-push hook syncs only if needed.
      **For strict sync**: Use `bd_land` manually or set `bd_config_workflow agent`
      **Something broke?** `bd_fix`
      <!-- END BEADS INTEGRATION -->

  # Code review workflow reminder
  - file: "_bmad/bmm/workflows/4-implementation/code-review/instructions.xml"
    point: "code-review-beads-sync"
    requires: "beads-enabled"
    content: "After adding Review Follow-ups: `bd_sync_story {story-file}`"

# Shell aliases to install
aliases:
  source_file: "beads-aliases.sh"
  target: ".beads/lib/bmad-aliases.sh"
  install_instruction: |
    Source when needed in shell:
    source .beads/lib/bmad-aliases.sh
