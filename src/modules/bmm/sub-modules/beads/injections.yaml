# Beads Integration Injections
# These get injected into BMAD agent files during installation

injections:
  # Inject into ALL agents (bmad-master, pm, architect, sm, dev)
  - file: "_bmad/bmm/agents/dev.md"
    point: "beads-critical-actions"
    requires: "beads-enabled"
    content: |
      <!-- BEADS INTEGRATION -->
      ## Beads Runtime Coordination

      **When to Use Beads vs BMAD:**
      - BMAD: Formal outputs (story status, ADRs, workflow progress)
      - Beads: Runtime coordination (claims, blockers, decisions during work)

      **Session Start:**
      - `bd-status` → see ready work and blockers
      - `bd-claim "{story-key}"` → before starting work

      **During Work:**
      - Commit normally (hook auto-syncs beads)
      - `bd-halt "{reason}"` → critical blocker (stops work)
      - `bd-blocker "{title}"` → external blocker
      - `bd-decision "{title}"` → runtime decision

      **Session End (ALWAYS):**
      1. `bd-release {id}` → release claims
      2. `bd-preflight` → check if ready to push
      3. If ❌: `bd-land` then `bd-preflight` again
      4. If ✅: `git push`

      **Something Broke?** Run `bd-fix`
      <!-- END BEADS INTEGRATION -->

  - file: "_bmad/bmm/agents/sm.md"
    point: "beads-critical-actions"
    requires: "beads-enabled"
    content: |
      <!-- BEADS INTEGRATION -->
      ## Beads Runtime Coordination

      **When to Use Beads vs BMAD:**
      - BMAD: Sprint status (sprint-status.yaml), story tracking
      - Beads: Cross-story blockers, runtime decisions, action items

      **Session Start:**
      - `bd-status` → see blockers across stories

      **Sprint Management:**
      - `bd-blocker "Dep: Story {B} needs {A}"` → cross-story deps
      - `bd-decision "Defer: {story} to next sprint"` → deferrals
      - `bd-action "Action: {item}"` → retrospective items

      **Session End:**
      1. `bd-preflight` → check if ready
      2. If ❌: `bd-land` then `bd-preflight` again
      3. If ✅: `git push`
      <!-- END BEADS INTEGRATION -->

  - file: "_bmad/bmm/agents/pm.md"
    point: "beads-critical-actions"
    requires: "beads-enabled"
    content: |
      <!-- BEADS INTEGRATION -->
      ## Beads Runtime Coordination

      **When to Use Beads vs BMAD:**
      - BMAD: ADRs (architecture.md), phase progress (workflow-status.yaml)
      - Beads: Runtime scope/priority changes AFTER formal workflows

      **Runtime Decisions:**
      - `bd-decision "Scope: {change}"` → scope changes
      - `bd-decision "Priority: {change}"` → priority changes

      **Session End:**
      1. `bd-preflight` → check if ready
      2. If ❌: `bd-land` then `bd-preflight` again
      3. If ✅: `git push`
      <!-- END BEADS INTEGRATION -->

  - file: "_bmad/bmm/agents/architect.md"
    point: "beads-critical-actions"
    requires: "beads-enabled"
    content: |
      <!-- BEADS INTEGRATION -->
      ## Beads Runtime Coordination

      **When to Use Beads vs BMAD:**
      - BMAD: ADRs captured in architecture.md during workflow
      - Beads: Post-workflow tech/pattern changes only

      **Post-Architecture Changes:**
      - `bd-decision "Tech: {change}"` → technology pivots
      - `bd-decision "Pattern: {change}"` → pattern changes

      **Session End:**
      1. `bd-preflight` → check if ready
      2. If ❌: `bd-land` then `bd-preflight` again
      3. If ✅: `git push`
      <!-- END BEADS INTEGRATION -->

# Shell aliases to install
aliases:
  source_file: "beads-aliases.sh"
  target: "~/.bmad/beads-aliases.sh"
  install_instruction: |
    Add to your ~/.bashrc or ~/.zshrc:
    source ~/.bmad/beads-aliases.sh
