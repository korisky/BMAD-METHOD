# Beads Integration Component for BMAD Agents (v4)
# Inject these into agent critical_actions

# Principle: BMAD owns formal outputs. Beads owns runtime state and coordination.

injectable_critical_actions:
  # Add to ALL agents
  all_agents:
    # Session start
    - "Check HALT conditions first: `bd list --type blocker --priority 0`"
    - "Check blockers before picking story: `bd list --type blocker --status open`"
    - "Check work claims: `bd list --type task --status in_progress | grep Working:`"

    # During work
    - "Claim story before starting: `bd create --title 'Working: Story {key}' --type task --priority 1`"
    - "Runtime decisions (outside workflows): `bd create --type decision --priority 2`"
    - "External blockers: `bd create --type blocker --priority 1`"
    - "HALT conditions: `bd create --type blocker --priority 0` immediately"

    # Session end
    - "Close work claim when done: `bd close <id>`"
    - "Push before saying done: `bd sync && git push`"
    - "Include DOC: path in all Beads notes"

  # Role-specific - PM
  pm:
    - "ADRs go in architecture.md (BMAD) - NOT in Beads"
    - "Scope changes AFTER PRD done → `bd create --type decision`"
    - "Phase progress in workflow-status.yaml - NOT Beads"

  # Role-specific - Architect
  architect:
    - "ADRs captured during architecture workflow - NOT in Beads"
    - "Post-architecture technology pivots → `bd create --type decision`"

  # Role-specific - SM
  sm:
    - "Story status in sprint-status.yaml - NOT Beads"
    - "Cross-story dependencies → `bd create --type blocker`"
    - "Sprint deferrals → `bd create --type decision`"
    - "Retrospective action items → `bd create --type task` for each"

  # Role-specific - DEV
  dev:
    - "ALWAYS claim story before starting work"
    - "Task checkboxes in story file - NOT Beads"
    - "Mid-implementation discoveries → `bd create --type decision`"
    - "On HALT: `bd create --type blocker --priority 0` immediately"

# Priority scale
priority_guide:
  0: "HALT conditions, critical blockers"
  1: "Work claims, urgent blockers"
  2: "Decisions, action items"
  3: "Low priority"
  4: "Backlog"

# What NOT to track in Beads
do_not_track:
  - "Phase completion (workflow-status.yaml)"
  - "ADRs (architecture.md)"
  - "Story status (sprint-status.yaml)"
  - "Task progress (story file checkboxes)"
  - "Code review findings (story file)"
  - "Retrospective content (retro docs)"

# What TO track in Beads
do_track:
  - "Work claims (prevent concurrent edits)"
  - "Runtime decisions (outside formal workflows)"
  - "External blockers"
  - "HALT conditions (priority 0)"
  - "Cross-story dependencies"
  - "Persistent action items"

# Trigger phrases
trigger_phrases:
  "any HALTs?": "bd list --type blocker --priority 0"
  "what's blocked?": "bd list --type blocker --status open"
  "what decisions?": "bd list --type decision --status open"
  "who's working?": "bd list --type task --status in_progress"
  "action items?": "bd list --type task --status open"
  "claim story X": "bd create --title 'Working: Story X' --type task --priority 1"
  "HALT": "bd create --type blocker --priority 0"
  "land the plane": "Session close protocol"

# Notes format
notes_format: "WHO: {agent} | WHAT: {item} | WHY: {reason} | DOC: {bmad_doc_path}"
