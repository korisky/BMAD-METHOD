# Beads Integration Component for BMAD Agents (v5 - Shell Aliases)
# Inject these into agent critical_actions

# Principle: BMAD owns formal outputs. Beads owns runtime state and coordination.

injectable_critical_actions:
  # Add to ALL agents
  all_agents:
    # Session start
    - "Check status first: `bd-status` (shows ready work + blockers)"
    - "Check HALTs: `bd-halts` (priority 0 issues)"
    - "See who's working: `bd-who`"

    # During work
    - "Claim story before starting: `bd-claim \"{story-key}\"`"
    - "Runtime decisions (outside workflows): `bd-decision \"{title}\"`"
    - "External blockers: `bd-blocker \"{title}\"`"
    - "HALT conditions: `bd-halt \"{reason}\"` immediately"
    - "Action items: `bd-action \"{title}\"`"

    # Session end
    - "Release claim when done: `bd-release <id>`"
    - "Git hooks auto-sync Beads on commit"
    - "Push before saying done"

  # Role-specific - PM
  pm:
    - "ADRs go in architecture.md (BMAD) - NOT in Beads"
    - "Scope changes AFTER PRD done → `bd-decision \"Scope: {change}\"`"
    - "Phase progress in workflow-status.yaml - NOT Beads"

  # Role-specific - Architect
  architect:
    - "ADRs captured during architecture workflow - NOT in Beads"
    - "Post-architecture technology pivots → `bd-decision \"Tech: {change}\"`"

  # Role-specific - SM
  sm:
    - "Story status in sprint-status.yaml - NOT Beads"
    - "Cross-story dependencies → `bd-blocker \"Dep: Story {B} needs {A}\"`"
    - "Sprint deferrals → `bd-decision \"Defer: {story}\"`"
    - "Retrospective action items → `bd-action \"{item}\"`"

  # Role-specific - DEV
  dev:
    - "ALWAYS claim story before starting: `bd-claim \"{story-key}\"`"
    - "Task checkboxes in story file - NOT Beads"
    - "Mid-implementation discoveries → `bd-decision \"{discovery}\"`"
    - "On HALT: `bd-halt \"{reason}\"` immediately"

# Priority scale (numbers only, not P0/P1/etc)
priority_guide:
  0: "HALT conditions, critical blockers"
  1: "Work claims, urgent blockers"
  2: "Decisions, action items"
  3: "Low priority"
  4: "Backlog"

# What NOT to track in Beads
do_not_track:
  - "Phase completion (workflow-status.yaml)"
  - "ADRs (architecture.md)"
  - "Story status (sprint-status.yaml)"
  - "Task progress (story file checkboxes)"
  - "Code review findings (story file)"
  - "Retrospective content (retro docs)"

# What TO track in Beads
do_track:
  - "Work claims (prevent concurrent edits)"
  - "Runtime decisions (outside formal workflows)"
  - "External blockers"
  - "HALT conditions (priority 0)"
  - "Cross-story dependencies"
  - "Persistent action items"

# Trigger phrases → shell aliases
trigger_phrases:
  "any HALTs?": "bd-halts"
  "what's blocked?": "bd-blockers"
  "what decisions?": "bd-decisions"
  "who's working?": "bd-who"
  "status": "bd-status"
  "what's ready?": "bd-next"
  "claim story X": "bd-claim \"X\""
  "release claim": "bd-release <id>"
  "HALT": "bd-halt \"reason\""
  "that's a decision": "bd-decision \"title\""
  "that's a blocker": "bd-blocker \"title\""
  "land the plane": "bd-land"
  "help": "bd-help"

# Notes format
notes_format: "WHO: {agent} | WHAT: {item} | WHY: {reason} | DOC: {bmad_doc_path}"
