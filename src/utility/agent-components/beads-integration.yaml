# Beads Integration Component for BMAD Agents (v3)
# Inject these into agent critical_actions

# Principle: BMAD owns formal workflow outputs. Beads owns runtime state.

injectable_critical_actions:
  # Add to ALL agents
  all_agents:
    - "At session start: `bd list --type decision` and `bd list --type blocker` to check runtime state"
    - "For runtime decisions (made OUTSIDE workflows): `bd create --type decision`"
    - "For external blockers: `bd create --type blocker`"
    - "At session end: `bd sync && git push` - work isn't done until pushed"
    - "Include DOC: path in Beads notes to link back to BMAD docs"

  # Role-specific - PM
  pm:
    - "ADRs go in architecture.md (BMAD) - NOT in Beads"
    - "Scope changes AFTER PRD is done → `bd create --type decision`"
    - "Phase progress tracked by workflow-status.yaml - NOT Beads"

  # Role-specific - Architect
  architect:
    - "ADRs captured in architecture.md during workflow - NOT in Beads"
    - "Post-architecture technology pivots → `bd create --type decision`"

  # Role-specific - SM
  sm:
    - "Story status in sprint-status.yaml - NOT Beads"
    - "Sprint deferrals/priority changes → `bd create --type decision`"
    - "Cross-story dependencies → `bd create --type blocker` or `bd dep add`"

  # Role-specific - DEV
  dev:
    - "Task checkboxes in story file - NOT Beads"
    - "Mid-implementation discoveries → `bd create --type decision`"
    - "External blockers → `bd create --type blocker`"

# What NOT to track in Beads (BMAD handles these)
do_not_track:
  - "Phase completion (use bmm-workflow-status.yaml)"
  - "ADRs (use architecture.md)"
  - "Story status (use sprint-status.yaml)"
  - "Task progress (use story file checkboxes)"
  - "Workflow step progress (use frontmatter stepsCompleted)"

# What TO track in Beads (BMAD can't handle these)
do_track:
  - "Runtime decisions (choices made OUTSIDE formal workflows)"
  - "External blockers (waiting on API, approvals, etc.)"
  - "Cross-story dependencies (story A needs story B first)"

# Trigger phrases for human interaction
trigger_phrases:
  "what runtime decisions?": "bd list --type decision"
  "what's blocked?": "bd list --type blocker"
  "file that as runtime decision": "bd create --type decision"
  "that's a blocker": "bd create --type blocker"
  "land the plane": "Session close protocol"

# Notes format for context recovery
notes_format: "WHO: {agent} | WHAT: {choice} | WHY: {reason} | DOC: {bmad_doc_path}"
