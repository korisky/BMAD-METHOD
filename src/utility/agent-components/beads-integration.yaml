# Beads Integration Component for BMAD Agents (v5 - Shell Aliases)
# Inject these into agent critical_actions

# Principle: BMAD owns formal outputs. Beads owns runtime state and coordination.

injectable_critical_actions:
  # Add to ALL agents
  all_agents:
    # Session lifecycle
    - "START: Run `[WS]` for project state"
    - "END: Run `[HO]` + state NEXT agent/action"

    # Session start
    - "Check status first: `bd_status` (shows ready work + blockers)"
    - "Check HALTs: `bd_halts` (priority 0 issues)"
    - "See who's working: `bd_who`"

    # During work
    - 'Claim story before starting: `bd_claim "{story-key}"`'
    - 'Runtime decisions (outside workflows): `bd_decision "{title}"`'
    - 'External blockers: `bd_blocker "{title}"`'
    - 'HALT conditions: `bd_halt "{reason}"` immediately'
    - 'Action items: `bd_action "{title}"`'

    # Session end
    - "Release claim when done: `bd_release <id>`"
    - "Git hooks auto-sync Beads on commit"
    - "Push before saying done"

  # Role-specific - PM
  pm:
    - "ADRs go in architecture.md (BMAD) - NOT in Beads"
    - 'Scope changes AFTER PRD done → `bd_decision "Scope: {change}"`'
    - "Phase progress in workflow-status.yaml - NOT Beads"

  # Role-specific - Architect
  architect:
    - "ADRs captured during architecture workflow - NOT in Beads"
    - 'Post-architecture technology pivots → `bd_decision "Tech: {change}"`'

  # Role-specific - SM
  sm:
    - "Story status in sprint-status.yaml - NOT Beads"
    - 'Cross-story dependencies → `bd_blocker "Dep: Story {B} needs {A}"`'
    - 'Sprint deferrals → `bd_decision "Defer: {story}"`'
    - 'Retrospective action items → `bd_action "{item}"`'

  # Role-specific - DEV
  dev:
    - 'ALWAYS claim story before starting: `bd_claim "{story-key}"`'
    - "Task checkboxes in story file - NOT Beads"
    - 'Mid-implementation discoveries → `bd_decision "{discovery}"`'
    - 'On HALT: `bd_halt "{reason}"` immediately'

# Priority scale (numbers only, not P0/P1/etc)
priority_guide:
  0: "HALT conditions, critical blockers"
  1: "Work claims, urgent blockers"
  2: "Decisions, action items"
  3: "Low priority"
  4: "Backlog"

# What NOT to track in Beads
do_not_track:
  - "Phase completion (workflow-status.yaml)"
  - "ADRs (architecture.md)"
  - "Story status (sprint-status.yaml)"
  - "Task progress (story file checkboxes)"
  - "Code review findings (story file)"
  - "Retrospective content (retro docs)"

# What TO track in Beads
do_track:
  - "Work claims (prevent concurrent edits)"
  - "Runtime decisions (outside formal workflows)"
  - "External blockers"
  - "HALT conditions (priority 0)"
  - "Cross-story dependencies"
  - "Persistent action items"

# Trigger phrases → shell aliases
trigger_phrases:
  "any HALTs?": "bd_halts"
  "what's blocked?": "bd_blockers"
  "what decisions?": "bd_decisions"
  "who's working?": "bd_who"
  "status": "bd_status"
  "what's ready?": "bd_next"
  "claim story X": 'bd_claim "X"'
  "release claim": "bd_release <id>"
  "HALT": 'bd_halt "reason"'
  "that's a decision": 'bd_decision "title"'
  "that's a blocker": 'bd_blocker "title"'
  "land the plane": "bd_land"
  "help": "bd_help"

# Notes format
notes_format: "WHO: {agent} | WHAT: {item} | WHY: {reason} | DOC: {bmad_doc_path}"
